name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual trigger for testing builds

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          cp scripts/install.sh .
          cp scripts/install.ps1 .
          cp scripts/uninstall.sh .
          cp scripts/uninstall.ps1 .
          sha256sum \
            mcp-harbour-linux-x64.tar.gz \
            mcp-harbour-darwin-arm64.tar.gz \
            mcp-harbour-windows-x64.zip \
            install.sh \
            install.ps1 \
            uninstall.sh \
            uninstall.ps1 > checksums.txt

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Extract this version's section from CHANGELOG.md (from its heading up
          # to the next version heading).
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > notes.md || true
          sed -i -e '/./,$!d' notes.md   # drop leading blank lines
          gen=false
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::No CHANGELOG.md entry for $version; falling back to auto-generated notes."
            gen=true
            : > notes.md
          fi
          # Constant install/verify footer appended to every release.
          cat .github/release-footer.md >> notes.md
          echo "generate=$gen" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: |
            mcp-harbour-linux-x64.tar.gz
            mcp-harbour-darwin-arm64.tar.gz
            mcp-harbour-windows-x64.zip
            install.sh
            install.ps1
            uninstall.sh
            uninstall.ps1
            checksums.txt
