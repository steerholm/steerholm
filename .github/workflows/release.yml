name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual trigger for testing builds

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          cp scripts/install.sh .
          cp scripts/install.ps1 .
          cp scripts/uninstall.sh .
          cp scripts/uninstall.ps1 .
          sha256sum \
            steerholm-linux-x64.tar.gz \
            steerholm-darwin-arm64.tar.gz \
            steerholm-windows-x64.zip \
            install.sh \
            install.ps1 \
            uninstall.sh \
            uninstall.ps1 > checksums.txt

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Extract this version's section from CHANGELOG.md (from its heading up
          # to the next version heading).
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > notes.md || true
          sed -i -e '/./,$!d' notes.md   # drop leading blank lines
          gen=false
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::No CHANGELOG.md entry for $version; falling back to auto-generated notes."
            gen=true
            : > notes.md
          fi
          # Constant install/verify footer appended to every release.
          cat .github/release-footer.md >> notes.md
          echo "generate=$gen" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          # A tag with a suffix (v0.2.0-rc.1) is a pre-release: GitHub leaves it out
          # of /releases/latest, which is what `holm update` and the installers
          # follow, so only `--tag` / STEERHOLM_VERSION can reach it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: |
            steerholm-linux-x64.tar.gz
            steerholm-darwin-arm64.tar.gz
            steerholm-windows-x64.zip
            install.sh
            install.ps1
            uninstall.sh
            uninstall.ps1
            checksums.txt

  release-branch:
    # A release (not a pre-release) starts its line's release branch, release/X.Y,
    # or moves it to this tag. The Docs workflow publishes each line from it. A
    # branch is never moved while it has a commit this tag doesn't contain.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start or move the release branch
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          branch="release/$(printf '%s' "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')"
          ref="refs/remotes/origin/$branch"
          if ! git rev-parse -q --verify "$ref" >/dev/null; then
            echo "creating $branch at $TAG"
            git push origin "$TAG^{commit}:refs/heads/$branch"
          elif git merge-base --is-ancestor "$TAG" "$ref"; then
            echo "$branch already contains $TAG"
          elif git cherry "$TAG" "$ref" | grep -q '^+'; then
            echo "::error::$branch has commits that $TAG does not contain; cherry-pick them onto main and move the branch by hand:"
            git cherry -v "$TAG" "$ref" | grep '^+'
            exit 1
          else
            echo "moving $branch to $TAG"
            git push --force-with-lease="refs/heads/$branch:$(git rev-parse "$ref")" \
              origin "$TAG^{commit}:refs/heads/$branch"
          fi
