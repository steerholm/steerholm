name: Docs

# Publishes versioned docs to the `docs-live` branch, which Mintlify deploys.
# `docs-live` is rebuilt from the release branches: each `release/X.Y` branch is
# published as version vX.Y, and the highest line becomes the default, served at
# /latest/... (older lines at /vX.Y/...). The Release workflow keeps each branch
# at its line's newest release; docs fixes for a released version are
# cherry-picked onto its branch. The working docs on `main` stay a single, flat
# "next" version (served only via Mintlify PR previews).
#
# Runs after each Release run, after each push to a release branch, and manually.
# A push runs the workflow file on the pushed branch, which can be older than
# main's, so that run only starts this workflow on main, where the build runs.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-live
  cancel-in-progress: false

jobs:
  forward:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the docs build on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref main --repo "${{ github.repository }}"

  publish:
    if: >-
      github.event_name != 'push' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history + tags, script, branding)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare docs-live worktree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
          if git clone --branch docs-live --single-branch "$url" live 2>/dev/null; then
            echo "cloned existing docs-live"
          else
            echo "docs-live does not exist yet; starting a fresh branch"
            mkdir -p live
            git -C live init -q
            git -C live checkout -q -b docs-live
            git -C live remote add origin "$url"
          fi

      - name: Rebuild docs-live from release branches
        shell: bash
        run: |
          rm -rf live/docs && mkdir -p live/docs
          branches="$(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/release/' \
            | grep -E '^release/[0-9]+\.[0-9]+$' || true)"
          if [ -z "$branches" ]; then
            echo "no release branches found; nothing to publish"
            exit 0
          fi

          for branch in $branches; do
            line="v${branch#release/}"
            ref="origin/$branch"
            if ! git cat-file -e "$ref:docs" 2>/dev/null; then
              echo "skip $line: $branch has no docs/ tree"
              continue
            fi
            echo "snapshotting $line from $branch"
            rm -rf content && mkdir -p content
            git archive "$ref" docs | tar -x -C content
            python3 scripts/snapshot_docs.py \
              --version "$line" \
              --content-source content/docs \
              --config-source docs \
              --dest live/docs
          done
          python3 scripts/snapshot_docs.py --finalize --dest live/docs

      - name: Commit and push docs-live
        shell: bash
        run: |
          cd live
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no docs changes to publish"
            exit 0
          fi
          git commit -m "docs: rebuild docs-live from release branches"
          git push origin docs-live
