name: Build

# Reusable binary build shared by release.yml and test-matrix.yml so the
# packaging definition lives in exactly one place.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller keyrings.alt

      # keyrings.alt is collected because MIGRATION m0002 needs to read it.
      #
      # Steerholm no longer stores anything in the keyring — agent key hashes
      # live in config.json — but installs that predate that change kept them
      # there, and m0002 carries them across. On a headless box keyring selects
      # keyrings.alt's PlaintextKeyring automatically (no PYTHON_KEYRING_BACKEND
      # needed: with no D-Bus, SecretService is not viable and PlaintextKeyring
      # is), so that is where those users' hashes are. Without this the
      # migration silently recovers nothing and every such user has to reissue
      # every access key.
      #
      # It can only be dropped once no un-migrated install is left, which is a
      # judgement call, not something the code can decide. See
      # steerholm/migrations/m0002_key_hash_in_config.py.
      - name: Build holm
        run: pyinstaller --onefile --name holm --collect-all keyrings.alt entry_holm.py

      # Windowless daemon used by the per-user logon task so no console window
      # appears. Same gateway as `holm serve`; --windowed = GUI subsystem.
      - name: Build holmd (Windows, windowless daemon)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name holmd --collect-all keyrings.alt entry_holmd.py

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp dist/holm release/
          cp scripts/install.sh release/
          cp scripts/uninstall.sh release/
          tar -czf steerholm-${{ matrix.platform }}.tar.gz -C release .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir release
          copy dist\holm.exe release\
          copy dist\holmd.exe release\
          copy scripts\install.ps1 release\
          copy scripts\uninstall.ps1 release\
          Compress-Archive -Path release\* -DestinationPath steerholm-${{ matrix.platform }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: steerholm-${{ matrix.platform }}
          path: steerholm-${{ matrix.platform }}.*
