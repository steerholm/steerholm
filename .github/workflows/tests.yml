name: Tests

# Three stages that mirror the end-user journey:
#   1. tests    — unit + integration on all three OSes (+ npx protocol e2e)
#   2. build    — build the binaries on all three OSes
#   3. e2e      — run the real install script on those binaries and live-test the
#                 installed Harbour and its service-managed daemon, then uninstall
# All stages gate PRs. Allure results are grouped parentSuite=OS, suite=phase.
# The report publishes only on manual dispatch.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The frozen binary bundles keyrings.alt; select the file backend so identity
  # creation/verification works headless on every OS.
  PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
  # The CLI's update-available check would call the GitHub API on every command;
  # disable it in CI (shared-runner IPs get rate-limited, and it adds latency).
  MCP_HARBOUR_NO_UPDATE_CHECK: "1"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # ── Stage 1: tests on all three OSes ──────────────────────────────
  tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  osname: Linux }
          - { os: macos-latest,   osname: macOS }
          - { os: windows-latest, osname: Windows }
    runs-on: ${{ matrix.os }}
    env:
      ALLURE_OS: ${{ matrix.osname }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" keyrings.alt
      - name: Unit + integration
        run: python -m pytest tests/unit tests/integration --alluredir=allure-results -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-tests-${{ matrix.osname }}
          path: allure-results
          if-no-files-found: ignore

  # npx-backed protocol e2e (Linux only — OS-agnostic, npx is flaky on Win/mac).
  e2e-protocol:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      ALLURE_OS: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]" keyrings.alt
      - name: Pre-warm npx downstream (cache the package off the timed path)
        run: timeout 120 npx -y @modelcontextprotocol/server-everything </dev/null >/dev/null 2>&1 || true
      - name: E2E (protocol)
        run: python -m pytest tests/e2e --alluredir=allure-results -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-e2e-protocol
          path: allure-results
          if-no-files-found: ignore

  # ── Stage 2: build the binaries on all three OSes ─────────────────
  build:
    needs: [tests, e2e-protocol]
    uses: ./.github/workflows/build.yml

  # ── Stage 3: real install script + live tests against the daemon ──
  e2e-installed:
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  osname: Linux,   platform: linux-x64,    ext: tar.gz }
          - { os: macos-latest,   osname: macOS,   platform: darwin-arm64, ext: tar.gz }
          - { os: windows-latest, osname: Windows, platform: windows-x64,  ext: zip }
    runs-on: ${{ matrix.os }}
    env:
      ALLURE_OS: ${{ matrix.osname }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scenario deps
        run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: mcp-harbour-${{ matrix.platform }}
      - name: Install + live test + uninstall (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ github.workspace }}/mcp-harbour-${{ matrix.platform }}.${{ matrix.ext }}
          OSNAME: ${{ matrix.osname }}
          PLATFORM: ${{ matrix.platform }}
        run: bash tests/ci/e2e_installed.sh
      - name: Install + live test + uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ github.workspace }}\mcp-harbour-${{ matrix.platform }}.${{ matrix.ext }}
          OSNAME: ${{ matrix.osname }}
          PLATFORM: ${{ matrix.platform }}
        run: pwsh tests/ci/e2e_installed.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-installed-${{ matrix.platform }}
          path: allure-results
          if-no-files-found: ignore

  # Generate this run's Allure 3 report, publish it under runs/<run-number>/ on
  # the gh-pages branch (keeping prior runs), and regenerate the landing page.
  # Dispatch-only: PRs run the suite as validation but do not publish.
  report:
    if: github.event_name == 'workflow_dispatch'
    needs: [tests, e2e-protocol, e2e-installed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: allure-results-*
          merge-multiple: true
      - name: Restore Allure history
        uses: actions/cache@v4
        with:
          path: history.jsonl
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-
      - name: Generate Allure 3 report
        run: npx --yes allure@latest generate all-results -c allurerc.mjs --output run-report
      - name: Assemble site (this run's report + landing index)
        run: |
          mkdir -p "publish/runs/${{ github.run_number }}"
          cp -r run-report/. "publish/runs/${{ github.run_number }}/"
          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            git show origin/gh-pages:runs.json > publish/runs.json 2>/dev/null || echo "[]" > publish/runs.json
          else
            echo "[]" > publish/runs.json
          fi
          python tests/ci/build_report_index.py \
            --site publish \
            --results all-results \
            --repo "${{ github.repository }}" \
            --run-number "${{ github.run_number }}" \
            --run-id "${{ github.run_id }}" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --ref "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --trigger "${{ github.event_name }}"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          publish_branch: gh-pages
          keep_files: true

  # Real self-update against published releases (network path). Dispatch-only.
  self-update:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install previous release then update (Unix)
        if: runner.os != 'Windows'
        run: |
          MCP_HARBOUR_NO_SERVICE=1 bash scripts/install.sh
          BIN="$HOME/.local/bin/harbour"
          # The latest published release must itself expose `harbour update`;
          # releases before the updater shipped cannot be self-update-tested.
          if ! "$BIN" --help 2>&1 | grep -qw update; then
            echo "SKIP: the latest published release predates 'harbour update'; self-update E2E is pending an updater-capable release."
            exit 0
          fi
          "$BIN" version
          "$BIN" update --check
          "$BIN" update --yes
          "$BIN" version
      - name: Install previous release then update (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MCP_HARBOUR_NO_SERVICE = "1"
          powershell -ExecutionPolicy Bypass -File scripts/install.ps1
          $bin = Join-Path $env:LOCALAPPDATA "mcp-harbour\bin\harbour.exe"
          if ((& $bin --help 2>&1 | Out-String) -notmatch '\bupdate\b') {
            Write-Host "SKIP: the latest published release predates 'harbour update'; self-update E2E is pending an updater-capable release."
            exit 0
          }
          & $bin version
          & $bin update --check
          & $bin update --yes
          & $bin version
