[project]
name = "mcp-harbour"
dynamic = ["version"]
description = "The port authority for your MCP servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "mcp>=1.26.0,<1.27.0",
    "keyring>=24.0.0",
    "bcrypt>=4.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0"
]

[project.scripts]
harbour = "mcp_harbour.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.27.0",
    "allure-pytest>=2.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Single source of truth for the version: mcp_harbour/__init__.py __version__.
# Read at build time (AST, no import), so the frozen binary has no runtime
# importlib.metadata dependency.
[tool.setuptools.dynamic]
version = {attr = "mcp_harbour.__version__"}
